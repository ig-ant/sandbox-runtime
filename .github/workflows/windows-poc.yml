name: windows-poc

on:
  push:
    branches: [windows-poc]
  workflow_dispatch:

jobs:
  poc:
    name: poc (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path vendor/winsbox-poc/Cargo.toml

      - name: Run probes
        run: cargo run --release --manifest-path vendor/winsbox-poc/Cargo.toml -- all
        # A FAIL verdict is data, not a CI failure — only an ERROR (probe
        # crashed) returns non-zero. continue-on-error keeps the artifact
        # upload reachable even then.
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.runner }}
          path: vendor/winsbox-poc/RESULTS.md
          if-no-files-found: warn

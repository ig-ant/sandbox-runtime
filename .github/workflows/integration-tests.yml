name: Tests

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']

jobs:
  integration-tests:
    name: Tests (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-latest
            os: linux
          - arch: arm64
            runner: ubuntu-24.04-arm
            os: linux
          - arch: x86-64
            runner: macos-15-large
            os: macos
          - arch: arm64
            runner: macos-14
            os: macos
          # Windows leg: WFP+SID network sandbox (Phase 2.5).
          # GHA hosted windows-latest runs as Administrators member
          # with UAC disabled (ConsentPromptBehaviorAdmin=0), so
          # `sbox-exec install` and `FwpmFilterAdd0` work without
          # any elevation dance. See ci-investigation.md §2/§3.
          - arch: x86-64
            runner: windows-latest
            os: windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install system dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libseccomp-dev gcc socat ripgrep apparmor-profiles zsh

      - name: Enable unprivileged user namespaces (Linux)
        if: matrix.os == 'linux'
        run: |
          # Ubuntu 24.04+ sets kernel.apparmor_restrict_unprivileged_userns=1 which
          # allows unshare(CLONE_NEWUSER) but grants the new namespace zero
          # capabilities. Disable it so bwrap and apply-seccomp can nest
          # namespaces without needing setuid.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

          # Verify bwrap can create namespaces
          echo "Testing bwrap namespace creation..."
          bwrap --ro-bind / / --unshare-net true && echo "✓ bwrap namespace creation works" || echo "✗ bwrap namespace creation still fails"

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install ripgrep zsh

      # ─── Windows: WFP+SID sandbox setup ───────────────────────────────
      # GHA windows-latest already includes Rust, MSYS2, Git for Windows,
      # Node, and ripgrep. We only need to build sbox-exec, sanity-check
      # admin, and install WFP filters.
      - name: Verify admin + UAC-disabled (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $isAdmin = ([Security.Principal.WindowsPrincipal] `
            [Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator)
          if (-not $isAdmin) { throw "runner is not admin - WFP tests will fail" }
          $cp = (Get-ItemProperty `
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" `
            -Name ConsentPromptBehaviorAdmin -ErrorAction SilentlyContinue).ConsentPromptBehaviorAdmin
          Write-Host "ConsentPromptBehaviorAdmin = $cp (0 means UAC-disabled, expected)"

      - name: Install ripgrep (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          # ripgrep is preinstalled on most images, but install
          # defensively in case the image rotation drops it.
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            choco install ripgrep -y --no-progress
          }
          rg --version

      - name: Build sbox-exec (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        working-directory: vendor/winsbox-src
        run: |
          cargo build --release --bin sbox-exec --bin probe_token

      - name: Install WFP filters (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $exe = "vendor\winsbox-src\target\release\sbox-exec.exe"
          & $exe install
          & $exe install --check

      - name: Install Node dependencies
        run: npm install

      - name: Build seccomp binaries (Linux)
        if: matrix.os == 'linux'
        run: npm run build:seccomp

      - name: Build project
        run: npm run build

      - name: Run tests (Linux/macOS)
        if: matrix.os != 'windows'
        run: npm test

      - name: Run winsbox WFP+SID tests (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          SBOX_EXEC_PATH: ${{ github.workspace }}\vendor\winsbox-src\target\release\sbox-exec.exe
        run: |
          bun test test/sandbox/winsbox-wfp.test.ts --timeout 60000

      - name: Uninstall WFP filters (Windows, always)
        if: matrix.os == 'windows' && always()
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = "vendor\winsbox-src\target\release\sbox-exec.exe"
          if (Test-Path $exe) {
            & $exe install --remove
          }
          # TODO: switch to FWPM_SESSION_FLAG_DYNAMIC per-test sessions
          # (ci-investigation.md §3) so this cleanup becomes unnecessary;
          # for v1 we use Option A (persistent install + uninstall).

      - name: Run Node.js fallback tests
        if: matrix.os != 'windows'
        run: node test/utils/which-node-test.mjs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            test-results/
            *.log
          if-no-files-found: ignore

  docker-tests:
    name: Tests (docker / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable unprivileged user namespaces on host
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Run srt end-to-end in unprivileged container
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -e SRT_E2E_DOCKER=1 \
            ubuntu:24.04 \
            bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq bubblewrap socat ripgrep python3 curl ca-certificates unzip gcc libseccomp-dev
              curl -fsSL https://bun.sh/install | bash
              export PATH="$HOME/.bun/bin:$PATH"
              curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
              apt-get install -y -qq nodejs
              npm ci
              npm run build:seccomp
              npm run build
              bun test test/docker-weak-sandbox.test.ts
            '

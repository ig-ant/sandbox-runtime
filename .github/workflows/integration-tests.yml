name: Tests

on:
  push:
    branches: ['main', 'windows-*']
  pull_request:
    branches: ['**']

jobs:
  integration-tests:
    name: Tests (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-latest
            os: linux
          - arch: arm64
            runner: ubuntu-24.04-arm
            os: linux
          - arch: x86-64
            runner: macos-15-large
            os: macos
          - arch: arm64
            runner: macos-14
            os: macos
          - arch: x86-64
            runner: windows-latest
            os: windows
          - arch: arm64
            runner: windows-11-arm
            os: windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Windows runners ship Node 22 preinstalled; setup-node has no
        # Node 18 build for win-arm64, and the version isn't load-bearing
        # for the Windows test path.
        if: matrix.os != 'windows'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 1.3.1 lacks native win-arm64 builds; 1.3.13 has them. Keep
          # macOS/Linux on 1.3.1 to match the existing pin until that's
          # bumped repo-wide.
          bun-version: ${{ matrix.os == 'windows' && '1.3.13' || '1.3.1' }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libseccomp-dev gcc socat ripgrep apparmor-profiles zsh

      - name: Enable unprivileged user namespaces (Linux)
        if: matrix.os == 'linux'
        run: |
          # Ubuntu 24.04+ sets kernel.apparmor_restrict_unprivileged_userns=1 which
          # allows unshare(CLONE_NEWUSER) but grants the new namespace zero
          # capabilities. Disable it so bwrap and apply-seccomp can nest
          # namespaces without needing setuid.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

          # Verify bwrap can create namespaces
          echo "Testing bwrap namespace creation..."
          bwrap --ro-bind / / --unshare-net true && echo "✓ bwrap namespace creation works" || echo "✗ bwrap namespace creation still fails"

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install ripgrep zsh

      - name: Setup Rust toolchain (Windows)
        if: matrix.os == 'windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm install

      - name: Build seccomp binaries (Linux)
        if: matrix.os == 'linux'
        run: npm run build:seccomp

      - name: Build sbox-exec (Windows)
        if: matrix.os == 'windows'
        # Don't go through bun: on windows-11-arm bun runs under x64
        # emulation, so process.arch lies. RUNNER_ARCH is authoritative.
        shell: bash
        run: |
          set -euxo pipefail
          cargo build --release --manifest-path vendor/winsbox-src/Cargo.toml
          arch=$([ "$RUNNER_ARCH" = "ARM64" ] && echo arm64 || echo x64)
          mkdir -p "vendor/winsbox/$arch"
          cp vendor/winsbox-src/target/release/sbox-exec.exe "vendor/winsbox/$arch/"
          # Native Windows path so Node's fs.existsSync can find it.
          winpath=$(cygpath -w "$PWD/vendor/winsbox/$arch/sbox-exec.exe")
          echo "SBOX_EXEC_PATH=$winpath" >> "$GITHUB_ENV"

      - name: Build project
        run: npm run build

      - name: Run tests
        if: matrix.os != 'windows'
        run: npm test

      - name: Run tests (Windows)
        # Single canonical Windows path. Earlier matrix had separate
        # WINSBOX_TOKEN=lockdown and lockdown+alt-desktop runs as
        # bisection probes; the lockdown shape is being removed in
        # the ACL-stamping rebuild, so they're no longer informative.
        # The full suite has POSIX-shell assumptions and a Bun-on-Windows
        # crash in parent-proxy-tunnel.test.ts; scope to the Windows suite
        # for now. Porting the rest is tracked separately.
        if: matrix.os == 'windows'
        run: bun test --timeout 25000 test/sandbox/windows.test.ts
        env:
          WINSBOX_PHASE: '2'
        # NtCreateUserProcess shellcode stub is x64-only; arm64
        # falls back at runtime and the proc-hook tests fail there.
        continue-on-error: ${{ matrix.arch == 'arm64' }}

      - name: Run Node.js fallback tests
        if: matrix.os != 'windows'
        run: node test/utils/which-node-test.mjs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            test-results/
            *.log
          if-no-files-found: ignore

  docker-tests:
    name: Tests (docker / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable unprivileged user namespaces on host
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Run srt end-to-end in unprivileged container
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -e SRT_E2E_DOCKER=1 \
            ubuntu:24.04 \
            bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq bubblewrap socat ripgrep python3 curl ca-certificates unzip gcc libseccomp-dev
              curl -fsSL https://bun.sh/install | bash
              export PATH="$HOME/.bun/bin:$PATH"
              curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
              apt-get install -y -qq nodejs
              npm ci
              npm run build:seccomp
              npm run build
              bun test test/docker-weak-sandbox.test.ts
            '

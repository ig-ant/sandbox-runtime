[package]
name = "ac-cdylib"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

# `cargo build -p ac-cdylib --release` emits `ac_cdylib.dll` (cargo
# underscore-mangles the crate name). The broker locates it next to
# `sbox-exec.exe` (or via WINSBOX_CDYLIB / pol.cdylib_path).
#
# Phase E-1: `build.rs` emits link args to pin the cdylib's preferred
# image base (`/BASE`) and disable ASLR (`/DYNAMICBASE:NO`) so the
# broker's manual-mapper places the cdylib at the same VA in target
# memory it would have lived at if the loader had mapped it. The base
# (`0x190000000`) sits above typical loader heap mappings and below the
# canonical Win64 user-mode top, so VirtualAllocEx in the target there
# is collision-free.
#
# Phase E-5c: `#![no_std]`. The cdylib is manual-mapped pre-resume by
# the broker (no DllMain, no TLS callbacks); std would only contribute
# a TLS directory + runtime init the manual mapper has to skip. Going
# no_std drops the dependency on `windows` (which transitively pulls
# proc-macros + `windows-result` that need std) — we hand-declare the
# three ntdll syscalls used by the IPC round-trip.

[lib]
crate-type = ["cdylib"]

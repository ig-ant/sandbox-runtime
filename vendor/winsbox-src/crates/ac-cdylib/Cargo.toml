[package]
name = "ac-cdylib"
version = "0.1.0"
edition = "2021"
publish = false

# `cargo build -p ac-cdylib --release` emits `ac_cdylib.dll` (cargo
# underscore-mangles the crate name). The broker locates it next to
# `sbox-exec.exe` (or via WINSBOX_CDYLIB / pol.cdylib_path).

[lib]
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Memory",
] }

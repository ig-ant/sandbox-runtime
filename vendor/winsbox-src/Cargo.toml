[package]
name = "sbox-exec"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "sbox-exec"

[[bin]]
name = "sbox-exec"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Environment",
  "Win32_Security",
] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "symbols"

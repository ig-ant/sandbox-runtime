[workspace]
members = [".", "crates/spike-cdylib", "crates/ac-cdylib"]

[package]
name = "sbox-exec"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "sbox-exec"
# D-4: src/bin/* are vestigial probe binaries that depended on the
# deleted acl.rs module. Disable cargo auto-discovery; the kept
# binaries are listed explicitly via [[bin]] below.
autobins = false

[[bin]]
name = "sbox-exec"
path = "src/main.rs"

# Phase L: tiny self-contained token-privilege probe used as a drop-in
# replacement for `whoami /priv` in the windows.test.ts suite. `whoami`
# humanises each LUID via `LookupPrivilegeName`, which calls into LSA;
# under the lowbox the LSA ALPC port (`\RPC Control\lsasspirpc`) is
# unreachable so `whoami /priv` exits non-zero. This probe stays in
# pure ntdll territory — `OpenProcessToken` + `GetTokenInformation
# (TokenPrivileges)` — and prints the raw LUIDs.
[[bin]]
name = "probe_priv"
path = "src/bin/probe_priv.rs"

# Phase N-4 follow-up: minimal SSPI/Schannel diagnostic probe to settle
# whether `AcquireCredentialsHandle(OUTBOUND, Schannel)` is structurally
# broken inside the AppContainer, or whether curl was failing for a
# curl-specific reason. Calls `QuerySecurityPackageInfoW` +
# `AcquireCredentialsHandleW` + `InitializeSecurityContextW` directly
# with no curl in the loop. See `docs/n4_schannel_probe_findings.md`.
[[bin]]
name = "probe_schannel"
path = "src/bin/probe_schannel.rs"

# Phase D-4: probe binaries (`p10`/`p11`/`p12`/`p13`/`spike-inject`)
# were diagnostic tools that depended on the legacy `acl.rs` module.
# Their findings are recorded in commit messages + `cheeky-jingling-stream.md`;
# the source files stay in `src/bin/` for future ad-hoc reuse but
# are no longer part of the build.

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_JobObjects",
  "Win32_System_StationsAndDesktops",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
  "Win32_System_Pipes",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_Networking_WinSock",
  "Win32_System_SystemServices",
  "Win32_System_IO",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Wdk_Foundation",
  "Wdk_System_Threading",
  "Win32_System_Kernel",
  "Win32_System_RemoteDesktop",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Credentials",
] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "symbols"
# `crates/ac-cdylib` is `#![no_std]`; rustc requires a panic strategy
# selected at the profile level rather than per-crate. The broker has
# no `catch_unwind` or `panic::*` calls, so `abort` is safe here.
panic = "abort"

[profile.dev]
# Match release: needed so `cargo build` (not just `--release`) can
# link the no_std `ac-cdylib` cdylib. `cargo test` panics still abort
# the test binary, which the test harness handles cleanly — none of
# the broker's tests use `should_panic`/`catch_unwind`.
panic = "abort"

# Phase K fix-up: build `ac-cdylib` with optimisation even in dev so
# the manual-mapped hook bodies behave the same in `cargo build` and
# `cargo build --release` runs. Pre-fix-up the dev cdylib emitted by
# `cargo build` was unoptimised; on ARM64 the unoptimised hook
# prologues went off the rails when invoked from the loader (typical
# pattern: an `ADRP+ADD+LDR` chain to an `.rdata` constant whose
# manual-map placement fed the hook body the wrong VA on first
# entry). Release builds matched what production uses; the dev cdylib
# diverged just enough to AV the target during the loader's first
# `NtOpenSection`. Match opt-level=2 to keep the codegen identical
# across profiles. The cdylib is small enough that the optimisation
# cost on `cargo build` is negligible (<200 ms).
[profile.dev.package.ac-cdylib]
opt-level = 2
debug-assertions = false
overflow-checks = false

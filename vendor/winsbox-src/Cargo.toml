[workspace]
members = [".", "crates/spike-cdylib", "crates/ac-cdylib"]

[package]
name = "sbox-exec"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "sbox-exec"

[[bin]]
name = "sbox-exec"
path = "src/main.rs"

[[bin]]
name = "p10-grandchild"
path = "src/bin/p10_grandchild.rs"

[[bin]]
name = "p11-lsa"
path = "src/bin/p11_lsa.rs"

[[bin]]
name = "p12-lockdown"
path = "src/bin/p12_lockdown.rs"

[[bin]]
name = "p13-cygwin-ac"
path = "src/bin/p13_cygwin_ac.rs"

[[bin]]
name = "spike-inject"
path = "src/bin/spike_inject.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_JobObjects",
  "Win32_System_StationsAndDesktops",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
  "Win32_System_Pipes",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_Networking_WinSock",
  "Win32_System_SystemServices",
  "Win32_System_IO",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Wdk_Foundation",
  "Wdk_System_Threading",
  "Win32_System_Kernel",
  "Win32_System_RemoteDesktop",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Credentials",
] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "symbols"
# `crates/ac-cdylib` is `#![no_std]`; rustc requires a panic strategy
# selected at the profile level rather than per-crate. The broker has
# no `catch_unwind` or `panic::*` calls, so `abort` is safe here.
panic = "abort"

[profile.dev]
# Match release: needed so `cargo build` (not just `--release`) can
# link the no_std `ac-cdylib` cdylib. `cargo test` panics still abort
# the test binary, which the test harness handles cleanly — none of
# the broker's tests use `should_panic`/`catch_unwind`.
panic = "abort"
